{{- if .Values.ingress.admin.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-haproxy
  namespace: {{ .Release.Namespace }}
  labels: {{ include "keycloak.labels" $ | nindent 4 }}
data:
  haproxy.cfg: |
    frontend forbidden
    bind :{{ .Values.haproxy.service.port }}
    mode http

    http-request deny
{{- end -}}
