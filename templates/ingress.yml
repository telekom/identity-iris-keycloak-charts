{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  {{- include "keycloak.ingress.annotations" (dict "root" $ "ingress" .Values.ingress.default) | nindent 2 }}
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels: {{ include "keycloak.labels" $ | nindent 4 }}
spec:
  rules:
  {{- range (include "keycloak.hosts" . | fromYamlArray) }}
  - host: {{ . }}
    http:
      # With admin ingress enabled, the more specific master realm prefix goes to
      # HAProxy's deny listener; other realm requests go directly to Keycloak on port 80.
      # Without admin ingress, all /auth paths (including admin) go to Keycloak.
      # Prefix paths match whole path segments; this is routing, not authorization.
      paths: 
      {{- if $.Values.ingress.admin.enabled }}
      - backend:
          service:
            name: "{{ $.Release.Name }}"
            port:
              number: {{ $.Values.haproxy.service.port }}
        path: /auth/realms/master/
        pathType: Prefix
      - backend:
          service:
            name: "{{ $.Release.Name }}"
            port:
              number: 80
        path: /auth/realms/
        pathType: Prefix
      {{- else }}
      - backend:
          service:
            name: "{{ $.Release.Name }}"
            port:
              number: 80
        path: /auth/
        pathType: Prefix
      {{- end }}
  {{- end }}
{{- if .Values.ingress.default.ingressClassName }}
  ingressClassName: {{ .Values.ingress.default.ingressClassName }}
{{- end }}
{{- if .Values.ingress.default.tls.enabled }}
  tls:
  - hosts:
  {{- if and .Values.ingress.default.tls.hosts (gt (len .Values.ingress.default.tls.hosts) 0) }}
    {{- toYaml .Values.ingress.default.tls.hosts | nindent 6 }}
  {{- else }}
    - {{ .Values.ingress.default.hostname }}
  {{- end }}
{{- include "keycloak.tls.secret" (dict "root" $ "ingress" .Values.ingress.default) | nindent 4 -}}
{{- end }}
{{- end }}
