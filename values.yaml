global:
  #volumeName: "pvcNameToOverride"
  domain: ""
  labels:
    # Common labels for all resources
    common: {}
    # Monitoring related Labels
    monitoring:
      # General monitoring labels
      general: {}
      # Labels for monitoring specific to Keycloak service
      keycloak: {}
      # Labels for monitoring database services
      database: {}
  product: "iris_keycloak"
  ingress:
    # tlsSecret: ""
    annotations: {}
      # external-dns.alpha.kubernetes.io/target: ""
      # kubernetes.io/ingress.class: ""
  image:
    repository: iris_keycloak
    tag: 1.6.0
    pullPolicy: IfNotPresent
  # pull secrets has to be deployed independently
  imagePullSecrets: []
    # - name: yourSecretName
  imagePullPolicy: IfNotPresent

  # Configuration for external secrets integration (e.g., HashiCorp Vault, AWS Secrets Manager, etc.)
  externalSecrets:
    enabled: false
    path: "secret/data/my-app"

  database:
    port: 5432
    database: pgdb
    username: pgusr
    password: not_secure_pwd

  failOnUnsetValues: true

# You can list files (in /templates) here that should cause a re-deployment of your application
# when their contents change
# This makes sense if you change configMaps or secrets, and you
# want your deployment to use the latest configuration
templateChangeTriggers: []

revisionHistoryLimit: 10

podSecurityContext: {}
containerSecurityContext: {}

# custom annotations for iris pods
annotations: {}

#topologyKey: kubernetes.io/hostname

# Keycloak admin role credentials
adminUsername: admin
adminPassword: changeme

clientAuthMethodMetricsEnabled: "false"

# Options could be found in documentation: https://www.keycloak.org/server/configuration
# Some environments vars are already configured in: ./templates/_keycloak.tpl
keycloakExtraEnvVars:
  - name: KC_HTTP_METRICS_HISTOGRAMS_ENABLED
    value: "false"
  - name: KC_HTTP_METRICS_SLOS
    value: 5,10,25,50,250,500,1000,2500,5000,10000
  - name: KC_EVENT_METRICS_USER_ENABLED
    value: "true"
  - name: KC_EVENT_METRICS_USER_EVENTS
    value: login,logout,client_login
  - name: KC_EVENT_METRICS_USER_TAGS
    value: realm,clientId
  - name: QUARKUS_MICROMETER_BINDER_HTTP_SERVER_IGNORE_PATTERNS
    value: /auth/health.*,/auth/metrics
  - name: KC_CACHE
    value: ispn
  - name: KC_CACHE_STACK
    value: jdbc-ping
  - name: KC_CACHE_EMBEDDED_USERS_MAX_COUNT
    value: '10000'
  - name: KC_CACHE_EMBEDDED_REALMS_MAX_COUNT
    value: '10000'
  - name: KC_LOG_CONSOLE_OUTPUT
    value: json

